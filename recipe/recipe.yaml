context:
  name: tectonic
  version: "0.17.0"
  sha256: 30adda98f67dd5389844f6023adeeb54b5475c17a54b777900644468fbc9765d

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/tectonic-typesetting/${{ name }}/archive/refs/tags/${{ name }}@${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - if: win
      then:
        - m2w64-pkg-config
      else:
        - pkg-config
    - if: build_platform != target_platform
      then:
        - glib
        - harfbuzz
  host:
    - if: not osx
      then:
        - expat
        - fontconfig
    - freetype
    - glib  # development files needed by harfbuzz
    - graphite2
    - harfbuzz
    - icu
    - libpng
    - openssl
    - zlib
  run:
    - if: not osx
      then:
        - fontconfig
    - freetype
    - graphite2
    - harfbuzz
    - icu
    - libpng
    - openssl
    - zlib

tests:
  - files:
      recipe:
        - example.tex
    script:
      - tectonic --help
      - if: win
        then:
          # Rattler's build isolation forces USERPROFILE to %SRC_DIR% which causes
          # the SHGetFolderPath system call to fail, leading to the message
          # "error: App data directories not supported". This also triggers some
          # errors in bld.bat but they're not fatal.
          - SET "USERPROFILE=%HOMEDRIVE%%HOMEPATH%" & tectonic example.tex
        else: tectonic example.tex

about:
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: A modernized, complete, standalone TeX/LaTeX engine.
  homepage: https://tectonic-typesetting.github.io/
  repository: https://github.com/tectonic-typesetting/tectonic/
  documentation: https://tectonic-typesetting.github.io/book/latest/

extra:
  recipe-maintainers:
    - pkgw
    - anjos
